# AutoHub local stack: run everything with `docker compose up --build`
services:
  db:
    image: pgvector/pgvector:pg16          # Postgres with the pgvector extension built in
    environment:
      POSTGRES_USER: autohub
      POSTGRES_PASSWORD: autohub
      POSTGRES_DB: autohub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autohub"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine                  # job queue for background runs (Phase 1)
    ports:
      - "6379:6379"

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://autohub:autohub@db:5432/autohub
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app                     # live reload while developing

  worker:
    build: ./backend                       # same image as the api, different command
    command: python worker.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://autohub:autohub@db:5432/autohub
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - api                                # api creates the tables on startup
      - redis
    volumes:
      - ./backend:/app

  n8n:
    image: n8nio/n8n:2.44.6                # pinned: same version every rebuild
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Karachi
      N8N_SECURE_COOKIE: "false"
      AUTOHUB_API_URL: http://api:8000     # n8n reaches the API by its service name
      AUTOHUB_API_KEY: ${INBOUND_API_KEY:-} # read from .env, sent as X-AutoHub-Key
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false" # lets workflows read the two values above
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows         # exported workflow JSON lives in the repo

  dashboard:
    image: node:22-alpine                  # no Dockerfile needed for the dev server
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      API_PROXY_TARGET: http://api:8000    # Vite forwards /api here, so the browser sees one origin
      HMR_CLIENT_PORT: "443"               # live reload through the Codespaces https tunnel
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - dashboard_modules:/app/node_modules  # keeps Linux node_modules out of your folder

volumes:
  pgdata:
  n8ndata:
  dashboard_modules:
