# Runs on every push and pull request: backend tests, dashboard build, production image build.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: pytest (SQLite + a scripted fake Groq, so no key or network needed)
        working-directory: backend
        run: pytest -q

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: type-check and build
        run: npm run build
        working-directory: frontend

  image:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build (the same image Render deploys)
        run: docker build -t autohub .
      - name: start it and check /health
        run: |
          docker run -d --name autohub -p 8000:8000 -e DATABASE_URL=sqlite:////tmp/ci.db -e RUN_MODE=inline -e DEMO_SEED=true autohub
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health | grep '"database":"ok"'
          curl -sf localhost:8000/ | grep -q '<div id="root">'
